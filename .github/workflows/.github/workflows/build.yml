name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build App
        run: |
          xcodebuild build \
            -project AppDocTruyen.xcodeproj \
            -scheme AppDocTruyen \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AppDocTruyen.app Payload/
          zip -r AppDocTruyen.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppDocTruyen-IPA
          path: AppDocTruyen.ipa
